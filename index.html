<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZLC 法律文书自动生成系统</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--gold:#c9a962;--gold-light:#e0c87c;--red:#8b1a2b;--red-dark:#5c0f1c;--bg:#0d0d0d;--card:rgba(255,255,255,0.04);--card-border:rgba(201,169,98,0.15);--text:#e8e0d0;--text-dim:#999;--input-bg:rgba(255,255,255,0.06);--input-border:rgba(201,169,98,0.2)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Serif SC","SimSun","宋体",serif;background:var(--bg);color:var(--text);min-height:100vh;background-image:radial-gradient(ellipse at 20% 10%,rgba(139,26,43,0.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(201,169,98,0.06) 0%,transparent 60%)}
.container{max-width:960px;margin:0 auto;padding:20px}
.header{text-align:center;padding:40px 20px 30px;position:relative}
.header::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:80px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.logo-area{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px}
.logo-text{font-size:22px;font-weight:bold;letter-spacing:3px;background:linear-gradient(135deg,var(--gold-light),var(--gold),#a08040);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.badge{display:inline-block;background:var(--red);color:var(--gold-light);font-size:11px;padding:3px 10px;border-radius:12px;letter-spacing:1px}
.subtitle{font-size:14px;color:var(--text-dim);letter-spacing:2px}
.card{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--card-border);border-radius:12px;padding:24px;margin-bottom:16px;transition:border-color 0.3s}
.card:hover{border-color:rgba(201,169,98,0.3)}
.card-title{font-size:16px;font-weight:bold;color:var(--gold);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid rgba(201,169,98,0.15);display:flex;align-items:center;gap:8px}
.card-title .icon{font-size:18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid.col3{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:12px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase}
.form-group label .en{font-size:10px;color:#666;margin-left:6px}
.form-group input,.form-group select,.form-group textarea{background:var(--input-bg);border:1px solid var(--input-border);border-radius:8px;color:var(--text);padding:10px 14px;font-size:14px;font-family:inherit;outline:none;transition:border-color 0.3s,box-shadow 0.3s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,169,98,0.1)}
.form-group textarea{resize:vertical;min-height:60px}
.form-group select option{background:#1a1a1a;color:var(--text)}
.btn-area{text-align:center;padding:10px 0 30px}
.btn-generate{background:linear-gradient(135deg,var(--red-dark),var(--red));color:var(--gold-light);border:1px solid rgba(201,169,98,0.3);padding:14px 48px;font-size:16px;font-family:inherit;letter-spacing:2px;border-radius:30px;cursor:pointer;transition:all 0.3s;position:relative;overflow:hidden}
.btn-generate:hover{background:linear-gradient(135deg,var(--red),#a01e32);box-shadow:0 4px 20px rgba(139,26,43,0.3);transform:translateY(-1px)}
.btn-generate:active{transform:translateY(0)}
.btn-generate.loading{pointer-events:none;opacity:0.7}
.progress-bar{width:100%;height:4px;background:rgba(255,255,255,0.05);border-radius:2px;margin:12px 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:2px;width:0%;transition:width 0.3s}
.spinner{display:none;width:18px;height:18px;border:2px solid transparent;border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.result-area{display:none;margin-top:10px}
.result-area.show{display:block}
.result-card{background:rgba(201,169,98,0.06);border:1px solid rgba(201,169,98,0.2);border-radius:12px;padding:20px}
.result-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.result-item:last-child{border-bottom:none}
.result-icon{font-size:24px;flex-shrink:0}
.result-filename{flex:1;font-size:14px;word-break:break-all}
.success-badge{color:#4caf50;font-size:12px;background:rgba(76,175,80,0.1);padding:2px 8px;border-radius:10px}
.error-msg{color:#ff5252;font-size:13px;padding:12px;background:rgba(255,82,82,0.08);border-radius:8px}
.footer{text-align:center;padding:40px;font-size:11px;color:#444;border-top:1px solid rgba(255,255,255,0.04);margin-top:20px}
.footer a{color:#666;text-decoration:none}
.footer a:hover{color:var(--gold)}
@media(max-width:640px){.form-grid,.form-grid.col3{grid-template-columns:1fr}.container{padding:12px}}
</style>
</head>
<body>
<div class="container">

<div class="header">
<div class="logo-area"><span class="logo-text">ZLC</span><span class="badge">法律文书引擎</span></div>
<div class="subtitle">中银-力图-赵陈黄（横琴·深圳）联营律师事务所</div>
<div class="subtitle" style="font-size:11px;margin-top:4px;color:#555">Document Generator · 纯浏览器端 · 数据不上传</div>
</div>

<!-- 案件信息 -->
<div class="card">
<div class="card-title"><span class="icon">⚖️</span> 案件信息 / Case Info</div>
<div class="form-grid">
<div class="form-group"><label>案由 <span class="en">Cause of Action</span></label><input type="text" id="caseType" value="民间借贷纠纷" placeholder="如：民间借贷纠纷"></div>
<div class="form-group"><label>审级/程序 <span class="en">Stage</span></label><select id="stage"><option value="一审" selected>一审</option><option value="二审">二审</option><option value="执行">执行</option><option value="再审">再审</option></select></div>
<div class="form-group"><label>标的额（元）<span class="en">Amount</span></label><input type="text" id="amount" value="1570000" placeholder="如：1570000"></div>
<div class="form-group"><label>管辖法院 <span class="en">Court</span></label><input type="text" id="court" placeholder="如：深圳市福田区人民法院"></div>
<div class="form-group"><label>案号 <span class="en">Case No.</span></label><input type="text" id="caseNo" placeholder="如：(2026)粤0304民初1234号"></div>
</div>
</div>

<!-- 甲方 -->
<div class="card">
<div class="card-title"><span class="icon">👤</span> 甲方 / 委托人 <span class="en" style="font-size:12px;color:#999">Client</span></div>
<div class="form-grid">
<div class="form-group"><label>姓名 <span class="en">Name</span></label><input type="text" id="clientName" placeholder="如：吴锁春" required></div>
<div class="form-group"><label>性别 <span class="en">Gender</span></label><select id="clientGender"><option value="男" selected>男</option><option value="女">女</option></select></div>
<div class="form-group"><label>出生日期 <span class="en">D.O.B</span></label><input type="text" id="clientBirth" placeholder="如：1985年3月15日"></div>
<div class="form-group"><label>联系电话 <span class="en">Phone</span></label><input type="text" id="clientPhone" placeholder="手机号码"></div>
<div class="form-group full"><label>住址 <span class="en">Address</span></label><input type="text" id="clientAddress" placeholder="详细地址"></div>
</div>
</div>

<!-- 被告 -->
<div class="card">
<div class="card-title"><span class="icon">👥</span> 对方当事人 / 被告 <span class="en" style="font-size:12px;color:#999">Defendant(s)</span></div>
<div class="form-grid"><div class="form-group full"><label>名称（多个用顿号分隔）<span class="en">Name(s)</span></label><input type="text" id="defendants" value="刘国强、路洋" required></div></div>
</div>

<!-- 费用 -->
<div class="card">
<div class="card-title"><span class="icon">💰</span> 律师费 / Legal Fees</div>
<div class="form-grid">
<div class="form-group"><label>固定律师费（元）<span class="en">Fixed Fee</span></label><input type="text" id="feeFixed" value="24000"></div>
<div class="form-group"><label>风险代理比例 <span class="en">Risk Rate</span></label><input type="text" id="feeRisk" value="3%"></div>
</div>
</div>

<!-- 代理权限 -->
<div class="card">
<div class="card-title"><span class="icon">📋</span> 代理权限 / Authorization</div>
<div class="form-grid"><div class="form-group full"><label>委托书选项 <span class="en">Option</span></label><select id="authOption"><option value="A">A 一般代理</option><option value="B" selected>B 特别授权</option><option value="C">C 执行代理</option><option value="D">D 其他</option></select></div></div>
</div>

<div class="btn-area">
<button class="btn-generate" id="btnGenerate" onclick="doGenerate()">
<span class="spinner" id="spinner"></span>生成四份文书 / Generate 4 Documents
</button>
<div style="margin-top:8px;font-size:11px;color:#555">民事委托代理合同 · 授权委托书 · 律师事务所函 · 证据目录</div>
<div class="progress-bar" id="progressBar" style="display:none"><div class="progress-fill" id="progressFill"></div></div>
</div>

<div class="result-area" id="resultArea">
<div class="result-card" id="resultContent"></div>
</div>

<div class="footer">
中银-力图-赵陈黄（横琴·深圳）联营律师事务所 · 法律文书生成引擎 v2.0<br>
<a href="https://github.com/Neededxylitol/legal-doc-generator" target="_blank">GitHub</a> &nbsp;|&nbsp; 所有数据处理均在浏览器本地完成，不上传任何信息
</div>

</div>

<script>
// ═══════════════════════════════════════════
// 模板文件名映射
// ═══════════════════════════════════════════
const TEMPLATES = {
  contract: 'templates/1-contract.docx',
  auth: 'templates/2-auth-letter.docx',
  letter: 'templates/3-law-firm-letter.docx',
  evidence: 'templates/4-evidence-list.docx',
};

// 律所固定信息
const FIRM = {
  name: '中银-力图-赵陈黄（横琴·深圳）联营律师事务所',
  addr: '广东省深圳市前海深港合作区国际仲裁大厦第23层2306-2309号房',
  lawyer: '黄海',
  lawyerPhone: '15013500786',
};

// ═══════════════════════════════════════════
// XML 替换引擎（纯 JS 版本）
// ═══════════════════════════════════════════
function replaceXmlString(xml, replacements) {
  // 简单字符串替换
  for (const [oldStr, newStr] of replacements) {
    if (xml.includes(oldStr)) {
      xml = xml.replaceAll(oldStr, newStr);
    }
  }
  return xml;
}

// 定位含特定文本的 w:t 节点并替换
function replaceTagText(xml, targetText, newText) {
  // 匹配: <w:t ...>targetText</w:t>
  const re = new RegExp(
    '(<w:t[^>]*>)' +
    targetText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') +
    '(</w:t>)',
    'g'
  );
  let found = false;
  const result = xml.replace(re, (match, openTag, closeTag) => {
    if (found) return match;
    found = true;
    return openTag + newText + closeTag;
  });
  return result;
}

// ═══════════════════════════════════════════
// 生成单份文书
// ═══════════════════════════════════════════
async function generateOne(templateUrl, replacements, authOpt, filename) {
  // 加载模板
  const resp = await fetch(templateUrl);
  if (!resp.ok) throw new Error('模板加载失败: ' + templateUrl);
  const blob = await resp.blob();

  // 解压
  const zip = await JSZip.loadAsync(blob);
  let xml = await zip.file('word/document.xml').async('string');

  // 替换
  xml = replaceXmlString(xml, replacements);

  // 授权书特殊处理: C → authOpt
  if (authOpt && authOpt !== 'C') {
    // 找到独立的 <w:t>C</w:t>（在「第...项」上下文中的那个）
    // 策略: 替换第一个在 "第" 和 "项" 之间出现的独立 w:t C 节点
    const re = /第[^<]*(?:<[^>]*>)*\s*<w:t[^>]*>\s*C\s*<\/w:t>\s*(?:<[^>]*>)*\s*项/;
    if (re.test(xml)) {
      xml = xml.replace(
        /(<w:t[^>]*>)\s*C\s*(<\/w:t>)/,
        function(match, open, close, offset) {
          // 确保这个 C 在 "第" 和 "项" 之间
          const before = xml.substring(Math.max(0, offset - 80), offset);
          const after = xml.substring(offset + match.length, offset + match.length + 20);
          if (before.includes('第') && after.includes('项')) {
            return open + authOpt + close;
          }
          return match;
        }
      );
    }
  }

  // 重新打包
  zip.file('word/document.xml', xml);
  const newBlob = await zip.generateAsync({
    type: 'blob',
    mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
    compression: 'DEFLATE',
  });

  // 下载
  const url = URL.createObjectURL(newBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

// ═══════════════════════════════════════════
// 主流程
// ═══════════════════════════════════════════
async function doGenerate() {
  const btn = document.getElementById('btnGenerate');
  const spinner = document.getElementById('spinner');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const resultArea = document.getElementById('resultArea');
  const resultContent = document.getElementById('resultContent');

  // 收集数据
  const data = {
    client: document.getElementById('clientName').value.trim(),
    gender: document.getElementById('clientGender').value,
    birth: document.getElementById('clientBirth').value.trim(),
    phone: document.getElementById('clientPhone').value.trim(),
    addr: document.getElementById('clientAddress').value.trim(),
    defendants: document.getElementById('defendants').value.trim(),
    caseType: document.getElementById('caseType').value.trim(),
    stage: document.getElementById('stage').value,
    amount: document.getElementById('amount').value.trim(),
    court: document.getElementById('court').value.trim() || '____________人民法院',
    caseNo: document.getElementById('caseNo').value.trim() || '____________号',
    feeFixed: document.getElementById('feeFixed').value.trim(),
    feeRisk: document.getElementById('feeRisk').value.trim(),
    authOption: document.getElementById('authOption').value,
  };

  if (!data.client || !data.defendants || !data.caseType) {
    resultContent.innerHTML = '<div class="error-msg">⚠️ 请填写甲方姓名、对方当事人和案由</div>';
    resultArea.classList.add('show');
    return;
  }

  // UI 反馈
  btn.classList.add('loading');
  spinner.style.display = 'inline-block';
  progressBar.style.display = 'block';
  progressFill.style.width = '0%';
  resultArea.classList.add('show');
  resultContent.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:20px;">⏳ 正在浏览器中生成文书，请稍候...</div>';

  const files = [
    { tmpl: TEMPLATES.contract, name: `1. 民事委托代理合同-${data.client}-${data.caseType}.docx`,
      reps: [
        ['{{甲方姓名}}', data.client],
        ['{{对方当事人}}', data.defendants],
        ['{{案由}}', data.caseType],
        ['{{标的额}}', data.amount],
        ['{{审级}}', data.stage],
        ['{{管辖法院}}', data.court],
        ['刘国强、路洋', data.defendants],
        ['执行程序', data.stage === '执行' ? '执行程序' : data.stage + '程序'],
        ['{{实际回款金额}}', data.amount],
      ],
      authOption: null },

    { tmpl: TEMPLATES.auth, name: `2. 授权委托书-${data.client}-${data.caseType}.docx`,
      reps: [
        ['{{甲方姓名}}', data.client],
        ['{{甲方出生日期}}', data.birth],
        ['{{甲方住址}}', data.addr],
        ['{{甲方联系电话}}', data.phone],
        ['{{对方当事人}}{{案由}}', data.defendants + data.caseType],
        ['{{审级}}程序', data.stage + '程序'],
        ['{{审级}}', data.stage],
        ['{{期限选项}}', 'A'],
      ],
      authOption: data.authOption },

    { tmpl: TEMPLATES.letter, name: `3. 律师事务所函-${data.client}-${data.caseType}.docx`,
      reps: [
        ['{{甲方姓名}}', data.client],
        ['{{对方当事人}}', data.defendants],
        ['{{案由}}', data.caseType],
        ['{{审级}}程序', data.stage + '程序'],
        ['{{审级}}', data.stage],
        ['{{管辖法院}}', data.court],
        ['{{律师电话}}', FIRM.lawyerPhone],
        ['刘国强、路洋', data.defendants],
        ['民间借贷纠纷', data.caseType],
      ],
      authOption: null },

    { tmpl: TEMPLATES.evidence, name: `4. 证据目录-${data.client}-${data.caseType}.docx`,
      reps: [
        ['{{甲方姓名}}', data.client],
        ['路洋', data.defendants],
      ],
      authOption: null },
  ];

  try {
    const steps = [
      { label: '生成委托代理合同...', pct: 10 },
      { label: '生成授权委托书...', pct: 35 },
      { label: '生成律师事务所函...', pct: 60 },
      { label: '生成证据目录...', pct: 85 },
    ];

    for (let i = 0; i < files.length; i++) {
      resultContent.innerHTML = `<div style="text-align:center;color:var(--text-dim);padding:20px;">${steps[i].label}</div>`;
      progressFill.style.width = steps[i].pct + '%';

      await generateOne(files[i].tmpl, files[i].reps, files[i].authOption, files[i].name);

      // 小延迟让浏览器有时间触发下载
      await new Promise(r => setTimeout(r, 300));
    }

    progressFill.style.width = '100%';
    resultContent.innerHTML = `<div style="text-align:center;padding:20px;">
      <div style="font-weight:bold;color:var(--gold);margin-bottom:12px;font-size:18px;">✅ 生成完成！4 份文书已自动下载</div>
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:12px;">
        1. 民事委托代理合同-${data.client}-${data.caseType}.docx<br>
        2. 授权委托书-${data.client}-${data.caseType}.docx<br>
        3. 律师事务所函-${data.client}-${data.caseType}.docx<br>
        4. 证据目录-${data.client}-${data.caseType}.docx
      </div>
      <div style="font-size:11px;color:#555;">
        ⚠️ 请检查下载文件夹。所有数据处理均在浏览器本地完成，未上传任何信息。<br>
        所函需加盖律所公章 · 授权书需委托人当面签署
      </div>
    </div>`;
  } catch (e) {
    resultContent.innerHTML = `<div class="error-msg">❌ 生成失败: ${e.message}<br><br><span style="font-size:11px;">请确认模板文件存在，或检查网络连接后刷新重试。</span></div>`;
  } finally {
    btn.classList.remove('loading');
    spinner.style.display = 'none';
    setTimeout(() => { progressBar.style.display = 'none'; }, 1000);
  }
}
</script>
</body>
</html>
